plugins {
    id 'com.android.application' version '9.0.1'
}

def webRoot = file(providers.gradleProperty('webRoot').getOrElse('../wwwroot'))
def sharedCloudConfig = '../cloud-sync.defaults.json'
def localConfig = file('cloud-sync.json')
def cloudConfig = file(providers.gradleProperty('cloudConfig').getOrElse(
        localConfig.isFile() ? 'cloud-sync.json' : sharedCloudConfig))
if (providers.gradleProperty('outputDir').isPresent()) {
    layout.buildDirectory.set(file(providers.gradleProperty('outputDir').get()))
}
def stagedAssets = layout.buildDirectory.dir('generated/bookAssets')
def stageAssets = tasks.register('stageBookAssets', Sync) {
    into stagedAssets
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(webRoot) { into 'www' }
    from('LICENSE-NanoHTTPD.txt') { into 'licenses'; rename { 'NanoHTTPD.txt' } }
    from(new File(webRoot.parentFile, 'host/licenses')) { into 'licenses' }
    from(new File(webRoot.parentFile, 'licenses')) { into 'licenses' }
    from(cloudConfig) { rename { 'cloud-sync.json' } }
    doFirst {
        if (!new File(webRoot, 'runtime/net11.bin').isFile()) {
            throw new GradleException("Missing .NET 11 runtime in ${webRoot}")
        }
        if (!cloudConfig.isFile()) {
            throw new GradleException("Missing cloud configuration: ${cloudConfig}")
        }
    }
}

def previewConfig = file(providers.gradleProperty('previewCloudConfig').getOrElse(sharedCloudConfig))
def previewAssets = layout.buildDirectory.dir('generated/previewCloudAssets')
def stagePreviewConfig = tasks.register('stagePreviewConfig', Sync) {
    into previewAssets
    inputs.file(previewConfig)
    from(previewConfig) { rename { 'cloud-sync.json' } }
}

android {
    namespace 'ru.csharpbook.reader'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'ru.csharpbook.reader'
        minSdk 28
        targetSdk 35
        manifestPlaceholders = [bookLabel: 'Sharpwise']
        buildConfigField 'boolean', 'PRODUCTION_UPDATES', 'true'
        buildConfigField 'String', 'STABLE_CERT_SHA256', '"' + file('stable-cert.sha256').text.trim() + '"'
    }
    buildFeatures { buildConfig = true }
    buildTypes {
        preview {
            initWith release
            applicationIdSuffix '.preview'
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
            manifestPlaceholders = [bookLabel: 'Sharpwise · Тест']
            buildConfigField 'boolean', 'PRODUCTION_UPDATES', 'false'
        }
    }
    sourceSets.main {
        manifest.srcFile 'AndroidManifest.xml'
        java.srcDirs = ['app']
        res.srcDirs = ['res']
        assets.srcDirs = [stagedAssets]
    }
    sourceSets.preview.assets.srcDirs = [previewAssets]
    // BookServer serves byte ranges through AssetManager.openFd.
    androidResources.noCompress.add('')
}
def betaNumber = providers.gradleProperty('officialBetaNumber').orNull
def betaCode = providers.gradleProperty('officialBetaCode').orNull
if (betaNumber != null || betaCode != null) {
    def planned = new groovy.xml.XmlSlurper(false, false).parse(file('AndroidManifest.xml'))
    if (!(betaNumber ==~ /[1-9][0-9]{0,8}/) || !(betaCode ==~ /[1-9][0-9]{0,9}/) ||
            betaCode.toLong() >= planned.'@android:versionCode'.text().toLong()) {
        throw new GradleException('Set officialBetaNumber and a positive officialBetaCode below the planned stable versionCode.')
    }
    androidComponents.onVariants(androidComponents.selector().withBuildType('release')) { variant ->
        variant.outputs.each { output ->
            output.versionName.set(planned.'@android:versionName'.text() + '_b.' + betaNumber)
            output.versionCode.set(betaCode.toInteger())
        }
    }
}
tasks.named('preBuild').configure { dependsOn stageAssets }
tasks.matching { it.name == 'prePreviewBuild' }.configureEach { dependsOn stagePreviewConfig }

dependencies {
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'com.google.android.gms:play-services-auth:21.5.1'
}
